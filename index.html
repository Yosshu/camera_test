<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カメラテスト</title>
  <meta name="description" content="ブラウザだけで、PCやスマホのカメラの映り方・解像度・フレームレートを確認できるツールです。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>カメラテスト</h1>
    <p class="tagline">ブラウザだけで、カメラの映り方を確認できます。</p>
  </header>

  <main class="layout">
    <section class="viewer" aria-label="カメラ映像">
      <div class="video-frame" id="video-frame" data-state="idle">
        <video id="video" autoplay playsinline muted></video>
        <canvas class="depth-canvas" id="depth-canvas"></canvas>
        <div class="placeholder">
          <p>「カメラを開始」を押すと、ここに映像が表示されます。</p>
          <p class="placeholder-note">ブラウザからカメラの使用許可を求められたら「許可」を選んでください。</p>
        </div>
        <span class="status" id="status">停止中</span>
        <div class="depth-legend" id="depth-legend">
          <div class="depth-legend-bar"></div>
          <div class="depth-legend-labels">
            <span>近い <span id="depth-legend-near">—</span></span>
            <span>遠い <span id="depth-legend-far">—</span></span>
          </div>
          <p class="depth-legend-note" id="depth-legend-note"></p>
        </div>
        <button type="button" class="frame-button" id="fullscreen-button" aria-label="映像だけを全画面表示">
          <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>

      <div class="message" id="message" role="alert" hidden>
        <p class="message-title" id="message-title"></p>
        <p class="message-detail" id="message-detail"></p>
      </div>
    </section>

    <aside class="panel">
      <section class="card">
        <h2>カメラの設定</h2>
        <div class="field">
          <label for="camera-select">カメラ</label>
          <select id="camera-select"></select>
        </div>
        <div class="field" id="stream-field" hidden>
          <label for="stream-select">映像の種類</label>
          <select id="stream-select"></select>
        </div>
        <div class="depth-fields" id="depth-fields" hidden>
          <div class="field">
            <label for="depth-mode-select">深度の表示</label>
            <select id="depth-mode-select">
              <option value="color">カラー（近い＝青 → 遠い＝赤）</option>
              <option value="raw">そのまま（濃淡）</option>
            </select>
          </div>
          <div class="field" id="depth-range-field">
            <label for="depth-range-select">色を割り当てる距離</label>
            <select id="depth-range-select"></select>
          </div>
        </div>
        <div class="field">
          <label for="resolution-select">解像度</label>
          <select id="resolution-select"></select>
        </div>
        <div class="field">
          <label for="frame-rate-select">フレームレート</label>
          <select id="frame-rate-select"></select>
        </div>
        <div class="field field-checkbox">
          <label><input type="checkbox" id="native-only"> ブラウザによる縮小・切り抜きをしない</label>
          <p class="field-hint" id="native-only-hint">オンにすると、カメラ本来の解像度の中から要求に近いものが選ばれます。</p>
        </div>
        <button type="button" class="button button-primary" id="toggle-button">カメラを開始</button>
      </section>
    </aside>

    <section class="card info" aria-labelledby="info-heading">
      <h2 id="info-heading">カメラ情報</h2>
      <table class="info-table" id="info-table">
        <tbody></tbody>
      </table>
      <details class="raw">
        <summary>詳細データ（getSettings / getCapabilities）</summary>
        <pre id="raw-data"></pre>
      </details>
    </section>
  </main>

  <footer class="app-footer">
    <p>映像はこの端末のブラウザ内だけで処理され、外部には送信されません。</p>
  </footer>

  <script>
    // 広告ブロッカーなどで画面のスクリプトを読み込めなかったときに、黙って動かなくなるのではなく理由を知らせる。
    // ブロッカーに止められないよう、このページの中に直接書いておく。
    window.addEventListener('load', function () {
      if (document.body.dataset.app === 'ready') return;
      var message = document.getElementById('message');
      message.dataset.kind = 'error';
      document.getElementById('message-title').textContent = '画面を動かすためのファイルを読み込めませんでした';
      document.getElementById('message-detail').textContent =
        '広告ブロッカー（uBlock Origin など）の拡張機能が読み込みを止めている可能性があります。'
        + 'このサイトでブロッカーを無効にするか、シークレットウィンドウで開いてください。'
        + '再読み込み（Ctrl + F5）で直ることもあります。';
      message.hidden = false;
      document.getElementById('toggle-button').disabled = true;
    });
  </script>
</body>
</html>
